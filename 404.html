<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>404 • Page Not Found</title>

  <!-- Prevent indexing -->
  <meta name="robots" content="noindex">

  <!-- Auto redirect after 5 sec -->
  <meta http-equiv="refresh" content="5;url=/" />

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      height:100vh;
      overflow:hidden;
      font-family:Inter,Arial,sans-serif;
      background:#050816;
      display:flex;
      justify-content:center;
      align-items:center;
      position:relative;
      color:white;
    }

    /* Animated Background */
    .bg{
      position:absolute;
      inset:0;
      overflow:hidden;
      z-index:0;
    }

    .blob{
      position:absolute;
      border-radius:50%;
      filter:blur(80px);
      opacity:.45;
      animation:float 12s infinite ease-in-out alternate;
    }

    .blob1{
      width:320px;
      height:320px;
      background:#2563eb;
      top:-80px;
      left:-60px;
    }

    .blob2{
      width:280px;
      height:280px;
      background:#7c3aed;
      bottom:-60px;
      right:-40px;
      animation-delay:2s;
    }

    .blob3{
      width:220px;
      height:220px;
      background:#06b6d4;
      top:50%;
      left:55%;
      animation-delay:4s;
    }

    @keyframes float{
      from{
        transform:translateY(0px) translateX(0px);
      }
      to{
        transform:translateY(-40px) translateX(30px);
      }
    }

    /* Main Card */
    .container{
      position:relative;
      z-index:2;
      width:90%;
      max-width:700px;
      padding:50px 40px;
      border-radius:28px;
      background:rgba(255,255,255,0.06);
      border:1px solid rgba(255,255,255,0.1);
      backdrop-filter:blur(18px);
      text-align:center;
      box-shadow:
        0 10px 40px rgba(0,0,0,0.45),
        0 0 30px rgba(37,99,235,0.12);
    }

    .code{
      font-size:120px;
      font-weight:900;
      line-height:1;
      background:linear-gradient(90deg,#38bdf8,#818cf8,#c084fc);
      -webkit-background-clip:text;
      -webkit-text-fill-color:transparent;
      margin-bottom:15px;
      letter-spacing:4px;
    }

    h1{
      font-size:34px;
      margin-bottom:18px;
      font-weight:800;
    }

    p{
      color:#cbd5e1;
      font-size:17px;
      line-height:1.7;
      max-width:520px;
      margin:auto;
    }

    .countdown{
      margin-top:20px;
      color:#93c5fd;
      font-size:15px;
    }

    .buttons{
      margin-top:35px;
      display:flex;
      justify-content:center;
      gap:18px;
      flex-wrap:wrap;
    }

    .btn{
      padding:14px 28px;
      border-radius:14px;
      text-decoration:none;
      font-weight:700;
      transition:.3s ease;
      border:none;
      cursor:pointer;
      font-size:15px;
    }

    .home{
      background:linear-gradient(90deg,#2563eb,#3b82f6);
      color:white;
      box-shadow:0 8px 20px rgba(37,99,235,.35);
    }

    .back{
      background:rgba(255,255,255,0.08);
      color:white;
      border:1px solid rgba(255,255,255,0.1);
    }

    .btn:hover{
      transform:translateY(-4px) scale(1.02);
    }

    .footer{
      margin-top:30px;
      font-size:13px;
      color:#64748b;
    }

    @media(max-width:600px){

      .container{
        padding:40px 24px;
      }

      .code{
        font-size:88px;
      }

      h1{
        font-size:28px;
      }

      p{
        font-size:15px;
      }

      .btn{
        width:100%;
      }

      .buttons{
        flex-direction:column;
      }
    }
  </style>
</head>

<body>

  <!-- Animated BG -->
  <div class="bg">
    <div class="blob blob1"></div>
    <div class="blob blob2"></div>
    <div class="blob blob3"></div>
  </div>

  <!-- Main Content -->
  <div class="container">

    <div class="code">404</div>

    <h1>Page Not Found</h1>

    <p>
      The page you are trying to access may have been removed,
      renamed, or the URL might be incorrect.
      You’ll be redirected safely to the homepage shortly.
    </p>

    <div class="countdown">
      Redirecting to homepage in <span id="timer">5</span> seconds...
    </div>

    <div class="buttons">

      <a href="/" class="btn home">
        Go To Homepage
      </a>

      <button onclick="history.back()" class="btn back">
        Go Back
      </button>

    </div>

    <div class="footer">
      © 2026 guntools.dev • Secure & Fast Experience
    </div>

  </div>

  <script>
    let time = 5;

    const timer = document.getElementById("timer");

    setInterval(() => {
      time--;

      if(time >= 0){
        timer.textContent = time;
      }
    },1000);
  </script>

</body>
</html>
